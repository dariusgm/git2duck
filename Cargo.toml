[package]
name = "git2duck_duckdb"
version = "0.1.0"
edition = "2021"
description = "DuckDB extension that exposes Git repository history (commits, line metrics, branches, tags) as SQL table functions"
license = "MIT"
repository = "https://github.com/dariusgm/git2duck"
readme = "README.md"
keywords = ["duckdb", "git", "sql", "analytics", "extension"]
categories = ["database", "development-tools"]

[lib]
name = "git2duck"
crate-type = ["cdylib", "rlib"]

[dependencies]
gix = { version = "0.89", features = ["blocking-network-client", "blocking-http-transport-reqwest-rust-tls"] }
anyhow = "1.0"
serde_json = "1.0"
libc = "0.2"
duckdb = { version = "1.10506", features = ["bundled", "vtab"] }
duckdb-loadable-macros = "1.10506"
libduckdb-sys = "1.10506"
tempfile = "3.27"
similar = "3.2"
rayon = "1.12"
time = { version = "0.3", features = ["parsing", "formatting", "macros"] }
rustc-hash = "2.1"
memchr = "2.8"

[dev-dependencies]
duckdb = { version = "1.10506", features = ["bundled", "vtab"] }

[features]
ext = ["duckdb/loadable-extension"]


