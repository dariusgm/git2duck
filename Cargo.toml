[package]
name = "git2duck_duckdb"
version = "0.1.0"
edition = "2021"

[lib]
name = "git2duck"
crate-type = ["cdylib", "rlib"]

[dependencies]
gix = { version = "0.68", features = ["blocking-network-client", "blocking-http-transport-reqwest-rust-tls"] }
anyhow = "1.0"
serde_json = "1.0"
libc = "0.2"
duckdb = { version = "1.4", features = ["bundled", "vtab-loadable"] }
duckdb-loadable-macros = "0.1"
libduckdb-sys = "1.4"
tempfile = "3.10"
similar = "2.5"
rayon = "1.10"
time = { version = "0.3", features = ["parsing", "formatting", "macros"] }
rustc-hash = "2.0"
memchr = "2.7"

[dev-dependencies]
duckdb = { version = "1.4", features = ["bundled", "vtab-loadable"] }

[features]
ext = ["duckdb/loadable-extension"]


